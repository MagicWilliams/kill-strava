name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build + engine tests
    # macos-26, like testflight.yml: Tempo's minimum is iOS 26 (#145), and the run recorder
    # (#114) uses APIs the macos-15 image's iOS 18.5 SDK marks unavailable on iPhone
    # (HKLiveWorkoutBuilder, HKLiveWorkoutDataSource). The older image can't compile the app.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Not pinned: runner images move fast and a stale pin fails the whole loop.
      # If a toolchain bump ever breaks the build, pin here deliberately.
      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Device build proves the whole app compiles, including HealthKit paths
      # that are unavailable in the simulator. No signing on CI.
      - name: Build (device slice)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tempo.xcodeproj -scheme Tempo \
            -destination 'generic/platform=iOS' \
            -quiet build CODE_SIGNING_ALLOWED=NO

      # Resolved at run time, never pinned: a hardcoded simulator name is the most
      # common way an iOS pipeline rots (locally, 'iPhone 16' exists only on iOS 18.2).
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; \
                print(next(d['udid'] for rt in sorted(ds, reverse=True) for d in ds[rt] \
                if d.get('isAvailable') and 'iPhone' in d['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -i "$UDID" || true

      # Tests need a simulator. This is the gate agents cannot fake.
      - name: Test (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tempo.xcodeproj -scheme Tempo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -quiet test CODE_SIGNING_ALLOWED=NO

  edge:
    name: Edge functions typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck
        run: deno check supabase/functions/*/index.ts
      # The plan generator is pure arithmetic deciding whether a block reaches its race
      # (#63). Typechecking it proved nothing; this is the gate that does.
      - name: Test (edge function logic)
        run: deno test supabase/functions/
      # claim_usage holds the check that bounds the Anthropic bill, and it is SQL, so it is
      # tested against real Postgres (PGlite). Separate because it needs file and env access
      # the logic tests above don't have, and they should stay without it.
      - name: Test (usage limits in SQL)
        run: deno test --allow-all supabase/tests/
      - name: Lint
        run: deno lint supabase/functions/ || true

  # Separate from the iOS job on purpose: this is the one gate that can fail on a docs-only
  # change, and waiting 20 minutes for a macOS runner to tell you about a comment is how a
  # lint stops being run. Ubuntu, no toolchain, seconds.
  voice:
    name: Plain voice (comments and docs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The scanner itself is tested: what counts as prose, and what the allowlist excuses,
      # are the parts that decide whether the gate means anything (#267).
      - name: Test the scanner
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_plain_voice.py'
      - name: Check comments and docs
        run: python3 .github/scripts/check_plain_voice.py
