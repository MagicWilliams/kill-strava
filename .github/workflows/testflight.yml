name: TestFlight

# Merged-but-not-on-the-phone was the root cause behind every "needs device check" on the
# board (#59). This closes the last ten feet: every green `main` becomes a TestFlight build
# that arrives on David's phone as a notification.
#
# Ships only what CI already proved: it runs after the CI workflow succeeds on main, and
# checks out that exact commit — never a newer one that slipped in behind it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # A PR that touches the pipeline itself gets an unsigned archive, so a broken runner
  # image or Release-only compile error shows up before merge instead of after.
  pull_request:
    paths:
      - .github/workflows/testflight.yml
      - .github/scripts/**
      - ios/project.yml

concurrency:
  group: testflight
  cancel-in-progress: false   # never abandon an upload halfway

jobs:
  ship:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Signed upload needs all four. Until they exist (see docs/TESTFLIGHT.md), say so
      # loudly and fall back to an unsigned archive rather than failing every merge.
      #
      # The CI development identity (#183) is optional on top of that. Without it a signed
      # run still works the #103 way (Xcode mints a certificate, cleanup revokes it), so a
      # missing secret is a warning, never a failed merge. Only presence is passed in here;
      # the secret values themselves reach no step but the import.
      - name: Decide mode
        id: mode
        env:
          HAS_DEV_CERT_P12: ${{ secrets.CI_DEV_CERT_P12 != '' }}
          HAS_DEV_CERT_PASSWORD: ${{ secrets.CI_DEV_CERT_PASSWORD != '' }}
        run: |
          signed=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            :
          elif [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            signed=true
          else
            echo "::warning::TestFlight not configured (ASC_* secrets / APPLE_TEAM_ID var missing) — unsigned archive only, nothing uploaded. See docs/TESTFLIGHT.md."
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

          dev_identity=false
          if [ "$signed" = "true" ]; then
            missing=""
            [ "$HAS_DEV_CERT_P12" = "true" ] || missing="CI_DEV_CERT_P12"
            [ "$HAS_DEV_CERT_PASSWORD" = "true" ] || missing="${missing:+$missing and }CI_DEV_CERT_PASSWORD"
            if [ -z "$missing" ]; then
              dev_identity=true
            else
              echo "::warning::CI development identity not configured (repo secret $missing not set) — Xcode will mint an Apple Development certificate and the cleanup will revoke it, which emails David. See docs/TESTFLIGHT.md (#183)."
              echo "- CI development identity: **not configured** ($missing not set). Expect one minted and revoked below." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "dev_identity=$dev_identity" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: xcodebuild -version

      # The scripts below hold a DELETE against the live developer account. They prove
      # themselves on this exact runner image before they are trusted with it.
      - name: Test CI scripts
        run: python3 -m unittest discover -s .github/scripts -v

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      # Build numbers must strictly increase per marketing version. The run number does,
      # and it ties every build on the phone back to the Actions run that made it.
      - name: Archive (unsigned check)
        if: steps.mode.outputs.signed != 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tempo.xcodeproj -scheme Tempo -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tempo.xcarchive" \
            -quiet archive CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Cloud-managed signing: Xcode fetches/creates the distribution certificate and
      # profile through the App Store Connect API key, so no .p12 or profile ever lives in
      # this repo or its secrets. The key needs the Admin role for that to work.
      - name: Write API key
        if: steps.mode.outputs.signed == 'true'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Minting and revoking a development certificate on every run (#103) works, but Apple
      # emails "Your Certificate Has Been Revoked" for each one: 19 of them between 12 and
      # 15 Oct 2026. With one long-lived CI identity on the runner, Xcode reuses it and
      # mints nothing, and because that certificate predates the snapshot below, the
      # cleanup can never revoke it. The snapshot/cleanup steps stay as the safety net.
      #
      # The keychain is appended to the search list, not swapped in for it, and the login
      # keychain stays the default: if Xcode mints one anyway it lands where the cleanup
      # looks, and still gets revoked. Nothing here prints the secret, the .p12 or the
      # keychain password.
      - name: Import CI development identity
        if: steps.mode.outputs.signed == 'true' && steps.mode.outputs.dev_identity == 'true'
        env:
          CI_DEV_CERT_P12: ${{ secrets.CI_DEV_CERT_P12 }}
          CI_DEV_CERT_PASSWORD: ${{ secrets.CI_DEV_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/ci-dev.keychain-db"
          p12="$RUNNER_TEMP/ci-dev.p12"
          trap 'rm -f "$p12"' EXIT
          # Recorded first, so the always() removal step finds it even if a later line fails.
          echo "CI_KEYCHAIN=$kc" >> "$GITHUB_ENV"

          kc_password="$(openssl rand -hex 32)"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings "$kc"   # no -t, no -l: never times out or locks
          security unlock-keychain -p "$kc_password" "$kc"

          keychains=("$kc")
          while IFS= read -r line; do
            # create-keychain may already have listed it; keep it once, first.
            if [ -n "$line" ] && [ "$line" != "$kc" ]; then keychains+=("$line"); fi
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "${keychains[@]}"

          printf '%s' "$CI_DEV_CERT_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$kc" -f pkcs12 -P "$CI_DEV_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$kc_password" "$kc" > /dev/null

          identities="$(security find-identity -v -p codesigning "$kc")"
          count="$(printf '%s\n' "$identities" | grep -c '"Apple Development: ' || true)"
          if [ "$count" != "1" ]; then
            echo "::error::CI_DEV_CERT_P12 must hold exactly one valid Apple Development identity; found $count. Listing without -v shows invalid ones and why (see docs/TESTFLIGHT.md):"
            security find-identity -p codesigning "$kc"
            exit 1
          fi
          name="$(printf '%s\n' "$identities" | sed -n 's/.*"\(Apple Development: [^"]*\)".*/\1/p')"
          echo "Imported $name"
          echo "- CI development identity: **imported** (\`$name\`). Xcode should reuse it, so expect Minted this run: 0." >> "$GITHUB_STEP_SUMMARY"

      # A fresh runner has no development identity, so the signed archive below makes
      # Xcode mint a new Apple Development certificate on every run. Nothing ever revoked
      # them, and runs #16/#17 hit Apple's per-account cap (#103). Record what exists now
      # so the cleanup at the end can revoke this run's certificate and nothing else.
      # If this listing fails, stop: without it, old and new can't be told apart.
      - name: Snapshot development certificates
        id: certs_before
        if: steps.mode.outputs.signed == 'true'
        run: python3 .github/scripts/asc_certs.py snapshot --key "$KEY_PATH" --out "$RUNNER_TEMP/certs-before.json"

      - name: Archive (signed)
        if: steps.mode.outputs.signed == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tempo.xcodeproj -scheme Tempo -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tempo.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Write export options
        if: steps.mode.outputs.signed == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          # Same options, but to disk instead of to Apple, so the signed IPA can be opened.
          cp "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/ExportOptions-ipa.plist"
          plutil -replace destination -string export "$RUNNER_TEMP/ExportOptions-ipa.plist"

      # Exports the archive exactly as the upload will (same archive, same cloud-managed
      # distribution signing), but writes the IPA locally so its entitlements can be read
      # back before anything reaches TestFlight.
      - name: Export IPA (for the entitlements check)
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tempo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-ipa.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # A build without HealthKit is worse than no build: it installs, opens, and shows
      # nothing. Fail here, before upload, if signing dropped a capability.
      - name: Check entitlements
        if: steps.mode.outputs.signed == 'true'
        run: python3 .github/scripts/check_entitlements.py "$RUNNER_TEMP"/ipa/*.ipa

      - name: Upload to TestFlight
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tempo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} ($(git rev-parse --short HEAD)) — it appears in TestFlight after Apple finishes processing (~5–15 min)." >> "$GITHUB_STEP_SUMMARY"

      # Runs even when the archive, export or upload failed: a certificate minted by a run
      # that then broke is still a leak. Revokes only certificates that are both absent
      # from the snapshot AND in this runner's keychain, so David's Mac identity and any
      # pre-existing certificate are untouchable. Posts before/after counts to the summary.
      - name: Revoke this run's development certificate
        if: always() && steps.certs_before.outcome == 'success'
        run: python3 .github/scripts/asc_certs.py cleanup --key "$KEY_PATH" --before "$RUNNER_TEMP/certs-before.json"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      # After the cleanup, which reads the keychain search list. delete-keychain also takes
      # it off that list. The identity's certificate stays on the account for the next run.
      - name: Remove CI keychain
        if: always()
        run: |
          if [ -n "${CI_KEYCHAIN:-}" ] && [ -e "$CI_KEYCHAIN" ]; then
            security delete-keychain "$CI_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/ci-dev.p12"
