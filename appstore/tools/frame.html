<!doctype html>
<!-- One App Store screenshot: a short caption over a real capture of the app. Rendered by
     compose.py. The capture is never edited; only its position and crop are set here. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Space Grotesk"; src: url("../../ios/Tempo/Resources/Fonts/SpaceGrotesk-Bold.ttf"); font-weight: 700; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0B0D10; }
.cap { position: absolute; left: 7vw; right: 7vw; top: 6.2vh; color: #F3F5F8;
  font: 700 9.6vw/1.06 "Space Grotesk", sans-serif; letter-spacing: -0.025em; }
.cap em { font-style: normal; color: #CDFB45; }
/* The screen runs off the bottom of the canvas, so the tab bar is not what the eye lands on. */
.screen { position: absolute; left: 7vw; width: 86vw; top: 24vh; bottom: -6vh; overflow: hidden;
  border-radius: 6.5vw 6.5vw 0 0; background: #000; box-shadow: 0 0 0 0.35vw #2A3038; }
.screen img { display: block; width: 100%; }
</style></head><body>
<div class="cap" id="cap"></div>
<div class="screen"><img id="img"></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('cap').innerHTML = q.get('cap');
const img = document.getElementById('img');
img.src = q.get('img');
// Fraction of the capture's height hidden off the top, for screens that scroll under the clock.
img.style.marginTop = `calc(-1 * ${q.get('crop') || 0} * 86vw * ${q.get('ratio')})`;
</script></body></html>
