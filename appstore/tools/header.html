<!doctype html>
<!-- Product page header and universal art. Rendered by render_header.py at each exact size.
     The bars are the app icon's: rising weeks, with the last one lit. Apple publishes no numeric
     safe area, so the line and the lit bar both sit inside the 3:2 and 21:9 crops of 16:9. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Space Grotesk"; src: url("../../ios/Tempo/Resources/Fonts/SpaceGrotesk-Bold.ttf"); font-weight: 700; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0B0D10; }
.stage { position: relative; width: 100vw; height: 100vh; }
.bars { position: absolute; inset: auto 0 0 0; height: 100%; display: flex; align-items: flex-end;
  justify-content: center; gap: 1.15vw; }
.bar { flex: 0 0 4.1vw; background: #3B4316; border-radius: 1.1vw 1.1vw 0 0; }
.bar.lit { background: #CDFB45; }
.line { position: absolute; left: 0; right: 0; top: 19vh; text-align: center; color: #F3F5F8;
  font: 700 var(--type)/1 "Space Grotesk", sans-serif; letter-spacing: -0.03em; }
</style></head><body><div class="stage">
<div class="bars" id="bars"></div>
<div class="line" id="line">Am I on track?</div>
</div><script>
const q = new URLSearchParams(location.search);
document.documentElement.style.setProperty('--type', q.get('type') || '8vw');
// Rising weeks with the step-backs a real block has. Index 13 is lit: just right of center.
const hs = [10,14,12,17,21,18,24,28,23,31,36,30,39,47,12,15,11,16,13,10,14,9,12,8];
const scale = parseFloat(q.get('scale') || '1');
const bars = document.getElementById('bars');
hs.forEach((h, i) => {
  const d = document.createElement('div');
  d.className = 'bar' + (i === 13 ? ' lit' : '');
  // Past the lit bar is the block still to come: nothing has been run there yet.
  if (i > 13) d.style.opacity = 0.34;
  d.style.height = (h * scale) + 'vh';
  bars.appendChild(d);
});
</script></body></html>
