name: Tempo
options:
  bundleIdPrefix: studio.delight
  # iOS 26: the first release where an iPhone app can run its own HKWorkoutSession +
  # HKLiveWorkoutBuilder (before 26 they exist on iPhone only mirrored from a Watch). The run
  # recorder (milestone "Run recorder v1") is built on them; David chose one native recording
  # path over a second hand-built one for iOS 17–25 (2026-10-12).
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "2P8QGJVNJ7"   # David Latimore II (Personal Team) — survives xcodegen regeneration
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Tempo:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - package: Supabase
        product: Supabase
      # Embedded under PlugIns/ (#76). The archive is the proof: the TestFlight workflow's
      # unsigned PR archive fails if the extension doesn't build in Release.
      - target: TempoWidgets
    sources:
      - path: Tempo
      - path: Shared
    info:
      path: Tempo/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        # Read from build settings, not hardcoded: TestFlight rejects a repeated build number,
        # and CI stamps CURRENT_PROJECT_VERSION with the Actions run number on every upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Tempo reads your runs from Apple Health to build and adapt your training plan."
        NSHealthUpdateUsageDescription: "Tempo saves the runs you record, with their route, distance and calories, to Apple Health."
        # Run recorder (#110). When In Use only, never Always: a run is always started from
        # the foreground, and CLLocationManager.allowsBackgroundLocationUpdates then keeps
        # updates flowing after the screen locks (blue pill). Smaller ask, easier review.
        NSLocationWhenInUseUsageDescription: "Tempo uses your location during a run you start, to map your route and measure distance and pace. It stops when the run ends."
        # Auto-pause (#113, #114) reads step speed from CMPedometer, which crashes without
        # this key; a treadmill run (#116) reads its distance from it. Asked for at the first
        # treadmill run or the first run with auto-pause on, whichever comes first.
        NSMotionUsageDescription: "Tempo uses your steps to measure distance on a treadmill and, with auto-pause on, to tell when you've stopped running and when you've started again."
        # The save screen (#129) offers a photo taken there and then. Library picks go through
        # PhotosPicker, which runs out of process and needs no permission at all.
        NSCameraUsageDescription: "Take a photo on the save screen to keep with your run."
        # location: allowsBackgroundLocationUpdates = true without this key is a fatal error,
        #   not a silent no-op (CLLocationManager docs).
        # audio: spoken split cues (#118) with the phone locked in a pocket. Without it,
        #   activating a .playback session from the background fails with '!pla'.
        # Deliberately absent: `workout-processing` is documented for watchOS only. On iPhone
        #   (iOS 26+, our minimum) the running HKWorkoutSession is what keeps a run alive in the
        #   background — including treadmill runs, which have no location updates.
        UIBackgroundModes: [location, audio]
        # Lock Screen + Dynamic Island while recording (#119).
        NSSupportsLiveActivities: true
        # HTTPS only, nothing custom — declaring it here skips the export-compliance
        # question App Store Connect otherwise asks on every single TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        # tempo://today, tempo://coach — where a widget tap lands (WidgetLink).
        CFBundleURLTypes:
          - CFBundleURLName: studio.delight.tempo
            CFBundleURLSchemes: [tempo]
        UIAppFonts:
          - SpaceGrotesk-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - RobotoMono-Medium.ttf
    entitlements:
      path: Tempo/Tempo.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Shared with TempoWidgets — the only channel between the app and its widgets.
        # Must match WidgetSnapshot.appGroup and the extension's entitlements exactly.
        com.apple.security.application-groups:
          - group.studio.delight.tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.delight.tempo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  # Home Screen, Today View and Lock Screen widgets (#76). Reads the snapshot the app writes
  # to the App Group; links nothing from the app but the pure shared files and the palette.
  TempoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TempoWidgets
      - path: Shared
      - path: Tempo/DesignSystem/Tokens.swift
      # The snapshot counts in miles; the widget prints it in the athlete's unit (#109)
      # with the app's own formatter, so the two can't disagree. Both files are pure.
      - path: Tempo/Engine/Units.swift
      - path: Tempo/Engine/UnitsDisplay.swift
      - path: Tempo/Resources/Fonts
        excludes: ["README.md"]
    info:
      path: TempoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        # Must equal the app's on every build — App Store Connect rejects an upload whose
        # extension version disagrees with its host. CI's CURRENT_PROJECT_VERSION override
        # applies to both targets.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - SpaceGrotesk-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - RobotoMono-Medium.ttf
    entitlements:
      path: TempoWidgets/TempoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.studio.delight.tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.delight.tempo.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  TempoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TempoUITests
    dependencies:
      - target: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.delight.tempo.uitests
        GENERATE_INFOPLIST_FILE: YES
  TempoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TempoTests
    dependencies:
      - target: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.delight.tempo.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TempoUI:
    build:
      targets:
        Tempo: all
        TempoUITests: [test]
    test:
      targets:
        - TempoUITests
    run:
      config: Debug
  Tempo:
    build:
      targets:
        Tempo: all
        TempoTests: [test]
    test:
      targets:
        - TempoTests
    run:
      config: Debug
