<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1c1a; --muted: #6b675f; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141312; --fg: #ece9e3; --muted: #a29d93; --accent: #fb923c; } }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Tempo</h1>
  <p>A running coach for iPhone, in a small TestFlight beta.</p>
  <p><a href="privacy.html">Privacy policy</a> · <a href="https://github.com/MagicWilliams/kill-strava">Source on GitHub</a></p>
</main>
</body>
</html>
